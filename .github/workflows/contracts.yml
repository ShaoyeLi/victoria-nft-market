name: Contract tests

on:
  push:
    paths:
      - "NFT-Market-master/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "NFT-Market-master/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NFT-Market-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NFT-Market-master/package-lock.json
      - run: npm ci
      - run: npm test
